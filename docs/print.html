<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gpura Corpus PDF View</title>
<meta name="description" content="A4 'mock PDF' view of the paper, or of a book's encoding: a layout facsimile re-typeset from PAGE-XML beside each scan, and a reading edition from TEI. Print or save as PDF.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+Malayalam:wght@400;600&display=swap">
<script>window.PagedConfig = { auto: false };</script>
<script src="https://unpkg.com/pagedjs@0.4.3/dist/paged.polyfill.min.js"></script>
<style>
/* Layout: A4 sheets on a grey desk (the ETS "mock PDF" pattern); a fixed toolbar that is not printed */
@font-face{font-family:"RIT Rachana";src:url("fonts/rit-rachana/RIT-Rachana-Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"RIT Rachana";src:url("fonts/rit-rachana/RIT-Rachana-Bold.woff2") format("woff2");font-weight:700}
:root{--ml-font:"Noto Serif Malayalam",serif}
html[data-lipi="old"]{--ml-font:"RIT Rachana","Noto Serif Malayalam",serif}
body{margin:0;background:#d9dde2;color:#1a242e;font-family:"IBM Plex Sans",system-ui,sans-serif}
@media screen and (max-width:900px){.pagedjs_pages{transform-origin:top center}}

/* paged media */
@page{size:A4;margin:18mm 17mm 20mm;@bottom-center{content:counter(page);font:9pt "IBM Plex Sans",sans-serif;color:#7a8591}
  @top-right{content:string(runhead);font:8pt "IBM Plex Sans",sans-serif;color:#7a8591}}

@page cover{@bottom-center{content:none}@top-right{content:none}}
.runhead{string-set:runhead content(text)}
.cover{page:cover;break-after:page;display:flex;flex-direction:column;justify-content:center;min-height:240mm}
.cover h1{font-family:Spectral,Georgia,serif;font-size:28pt;margin:0 0 6mm}
.cover p{font-size:10.5pt;color:#4a5663;max-width:140mm;line-height:1.5}
.part{break-before:page;font-family:Spectral,Georgia,serif;font-size:16pt;margin:0 0 3mm}
.part + p{font-size:9pt;color:#4a5663;margin:0 0 5mm;line-height:1.45}

/* layout facsimile sheet */
.sheet{break-after:page;display:flex;gap:6mm;justify-content:center;align-items:flex-start}
.sheet figure{margin:0;display:flex;flex-direction:column;gap:2mm}
.sheet figcaption{font-size:7.5pt;color:#7a8591}
.scan{display:block;border:.3mm solid #cfd5db;object-fit:contain}
.rt{position:relative;border:.3mm solid #cfd5db;background:#fff;overflow:hidden}
.rt-line{position:absolute;white-space:nowrap;line-height:1;transform-origin:0 50%;font-family:var(--ml-font);color:#1a242e}
.rt-line.head{font-weight:700}
.rt-line.unclear{color:#5a3a8a}
.rt-region{position:absolute;border:.2mm dashed #e2c9a0}

/* reading edition: tei2html's own styles come with it */
.edition .tei-reading{font-size:10.5pt}
.edition .tei-reading,.edition [lang="ml"]{font-family:var(--ml-font)!important}
.edition .tei-reading .controls,.edition .tei-reading input{display:none}

/* paper */
.paper{font-size:10pt;line-height:1.55}
.paper h1{font-family:Spectral,Georgia,serif;font-size:22pt;line-height:1.2;margin:0 0 3mm}
.paper h2{font-family:Spectral,Georgia,serif;font-size:14pt;margin:8mm 0 2mm;break-after:avoid}
.paper h3{font-size:10.5pt;margin:5mm 0 1.5mm;break-after:avoid}
.paper p,.paper li{max-width:none}
.paper .tw,.paper table,.paper .layers div,.paper pre{break-inside:avoid}
.paper .ml,.paper [lang="ml"]{font-family:var(--ml-font)}
.paper nav[aria-label="Contents"]{display:none}
.paper a{color:inherit;text-decoration:none}
</style>
</head>
<body>
<script>
(async function () {
  const SCREEN_CSS = `html,body{background:#d9dde2!important}
.pagedjs_pages{padding:64px 0 40px;display:flex;flex-direction:column;align-items:center}
.pagedjs_page{background:#fff!important;margin:0 auto 22px!important;box-shadow:0 2px 18px rgba(0,0,0,.18)!important}
.bar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;
  background:#fff;border-bottom:1px solid #cfd5db;font-size:.88rem}
.bar a,.bar button{font:inherit;color:#1a242e;background:none;border:1px solid #cfd5db;border-radius:7px;padding:5px 10px;cursor:pointer;text-decoration:none}
.bar .primary{background:#1a242e;color:#fff;border-color:#1a242e}
.bar [aria-pressed="true"]{background:#1a242e;color:#fff}
.bar .title{font-weight:600;margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .status{color:#7a8591}
@media print{.bar{display:none}.pagedjs_pages{padding:0}.pagedjs_page{margin:0!important;box-shadow:none!important}html,body{background:#fff!important}}
`;
  const q = new URLSearchParams(location.search);
  const item = q.get('item'), doc = q.get('doc');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const getText = u => fetch(u).then(r => { if (!r.ok) throw new Error(u + ': ' + r.status); return r.text(); });
  const NS = 'http://schema.primaresearch.org/PAGE/gts/pagecontent/2019-07-15';
  let lipi = 'new';
  try { lipi = localStorage.getItem('gpura-lipi') || 'new'; } catch (e) {}
  document.documentElement.dataset.lipi = lipi;
  let html = '', title = '', back = './';

  if (doc === 'paper') {
    const src = new DOMParser().parseFromString(await getText('paper/index.html'), 'text/html');
    const main = src.querySelector('main');
    main.querySelectorAll('nav').forEach(n => n.remove());
    src.querySelectorAll('head style').forEach(st => {      // the paper's own styles (light theme is forced)
      const e = document.createElement('style');
      e.textContent = st.textContent.replace(/(^|[},])\s*body\s*\{/g, '$1 .paper-body{');
      document.head.prepend(e);
    });
    title = src.title; back = 'paper/';
    html = `<div class="paper paper-body"><span class="runhead" hidden>${esc(src.querySelector('h1')?.textContent)}</span>${main.innerHTML}</div>`;
  } else if (item) {
    const base = `specimen/${item}/`;
    const meta = JSON.parse(await getText(base + 'pages.json'));
    title = meta.title || item; back = base;
    let pages = meta.pages || [];
    const want = q.get('pages');                     // e.g. pages=7 or pages=15-17 (viewer page numbers)
    if (want) {
      const keep = new Set();
      want.split(',').forEach(r => { const [a, b] = r.split('-').map(Number); for (let n = a; n <= (b || a); n++) keep.add(n); });
      pages = pages.filter(p => keep.has(+p.canvas));
    }
    html += `<section class="cover"><h1 lang="ml" class="ml">${esc(meta.title)}</h1>
      <p>${esc([meta.title_en, meta.author, meta.date].filter(Boolean).join(' · '))}</p>
      <p>Generated from the corpus files of this item: part 1 re-typesets every encoded line at its PAGE-XML position, beside the scan it was read from; part 2 is the reading text, rendered from the TEI file. Nothing here is drawn from the scan except the scan itself.</p>
      <p>${esc(meta.status || '')}</p>
      <p>Source: <a href="${esc(meta.gpura_item)}">${esc(meta.gpura_item)}</a> · Gpura Corpus · ${new Date().toISOString().slice(0,10)}</p></section>`;
    html += `<h2 class="part runhead">Part 1. Layout facsimile</h2><p>Left: Gpura's scan. Right: the same page drawn only from the encoding — each line's text placed at its recorded coordinates. Purple lines are machine readings marked uncertain. Dashed boxes are regions.</p>`;
    const W_MM = 80, H_MM = 200;
    for (const p of pages) {
      const xml = new DOMParser().parseFromString(await getText(base + p.id + '.page.xml'), 'application/xml');
      const pg = xml.getElementsByTagNameNS(NS, 'Page')[0];
      const W = +pg.getAttribute('imageWidth'), H = +pg.getAttribute('imageHeight');
      const s = Math.min(W_MM / W, H_MM / H), w = W * s, h = H * s;
      const box = el => { const pts = el.getElementsByTagNameNS(NS, 'Coords')[0].getAttribute('points').split(' ').map(t => t.split(',').map(Number));
        const xs = pts.map(a => a[0]), ys = pts.map(a => a[1]); return [Math.min(...xs), Math.min(...ys), Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)]; };
      let rt = '';
      for (const r of pg.children) {
        if (!/Region$/.test(r.localName) || !r.getElementsByTagNameNS(NS, 'Coords')[0]) continue;
        const [rx, ry, rw, rh] = box(r);
        rt += `<div class="rt-region" style="left:${rx*s}mm;top:${ry*s}mm;width:${rw*s}mm;height:${rh*s}mm"></div>`;
        const head = ['heading', 'header', 'page-number'].includes(r.getAttribute('type'));
        for (const l of r.getElementsByTagNameNS(NS, 'TextLine')) {
          const te = [...l.children].find(e => e.localName === 'TextEquiv' && (e.getAttribute('index') || '1') === '1');
          const t = te ? te.getElementsByTagNameNS(NS, 'Unicode')[0]?.textContent || '' : '';
          if (!t) continue;
          const [x, y, lw, lh] = box(l);
          const unclear = /unclear|cert:/.test(l.getAttribute('custom') || '');
          rt += `<div class="rt-line${head ? ' head' : ''}${unclear ? ' unclear' : ''}" data-w="${lw*s}" style="left:${x*s}mm;top:${(y + lh*0.1)*s}mm;font-size:${lh*s*0.62}mm">${esc(t)}</div>`;
        }
      }
      const label = `Viewer page ${p.canvas}${p.printed ? ' · printed p. ' + p.printed : ''}`;
      html += `<section class="sheet">
        <figure><img class="scan" src="${base}${p.id}.jpg" style="width:${w}mm;height:${h}mm" alt="Scan of ${esc(label)}"><figcaption>Scan · ${esc(label)}</figcaption></figure>
        <figure><div class="rt" lang="ml" style="width:${w}mm;height:${h}mm">${rt}</div><figcaption>Re-typeset from ${p.id}.page.xml</figcaption></figure>
      </section>`;
    }
    if (want) {
      html += `<p style="font-size:9pt;color:#7a8591;margin-top:6mm">Reading edition omitted: a page selection (pages=${esc(want)}) was given. Open the PDF view without it for the whole text.</p>`;
    } else {
    const rd = new DOMParser().parseFromString(await getText(base + 'reading.html'), 'text/html');
    rd.querySelectorAll('style').forEach(st => { const e = document.createElement('style'); e.textContent = st.textContent; document.head.appendChild(e); st.remove(); });
    html += `<h2 class="part runhead">Part 2. Reading edition</h2><p>The running text as encoded in TEI: headings, paragraphs continued across pages, page numbers and running heads set apart; uncertain readings marked.</p><div class="edition">${rd.body.innerHTML}</div>`;
    }
  } else {
    html = '<p>Nothing to show: open this page as print.html?doc=paper or print.html?item=&lt;book&gt;.</p>';
  }
  document.title = (title ? title + ' · ' : '') + 'PDF view';
  const wait = document.createElement('div');        // covers the raw content while Paged.js lays out pages
  wait.id = 'wait';
  wait.style.cssText = 'position:fixed;inset:0;z-index:20;background:#d9dde2;display:flex;align-items:center;justify-content:center;font:15px "IBM Plex Sans",sans-serif;color:#4a5663';
  wait.textContent = 'Laying out A4 pages…';
  document.documentElement.appendChild(wait);
  const src = document.createElement('div');
  src.innerHTML = html;
  document.body.appendChild(src);
  await Promise.all([...src.querySelectorAll('img')].map(i => i.decode().catch(() => {})));   // scans before paging

  // shrink or stretch each re-typeset line to its recorded width (the scan's type is not our font's width)
  function fit() {
    document.querySelectorAll('.rt-line').forEach(el => {
      el.style.transform = 'none';
      const want = parseFloat(el.dataset.w) * 96 / 25.4, got = el.getBoundingClientRect().width;
      if (got > 0) el.style.transform = `scaleX(${Math.max(0.45, Math.min(1.8, want / got))})`;
    });
  }
  await document.fonts.ready;
  // paginate the body's content into A4 pages; finish() runs from Paged.js's own after-render hook
  class Done extends window.Paged.Handler { afterRendered() { finish(); } }
  window.Paged.registerHandlers(Done);
  window.PagedPolyfill.preview().then(finish, e => console.error(e));
  let last = -1;                                    // fallback: finish once the page count stops changing
  const poll = setInterval(() => {
    const n = document.querySelectorAll('.pagedjs_page').length;
    if (n && n === last) { clearInterval(poll); finish(); }
    last = n;
  }, 700);

  async function finish() {
  if (document.querySelector('.bar')) return;
  document.getElementById('wait')?.remove();
  const late = document.createElement('style');     // added after pagination so Paged.js leaves it alone
  late.textContent = SCREEN_CSS;
  document.head.appendChild(late);
  await document.fonts.ready; fit();
  const bar = document.createElement('div');
  bar.className = 'bar';
  bar.innerHTML = `<span class="title">${esc(title)}</span>
    <span class="status"></span>
    ${item ? '<button type="button" data-l="old">Old script</button><button type="button" data-l="new">New script</button>' : ''}
    <a href="${back}">Back</a><button type="button" class="primary" id="pr">Print or save as PDF</button>`;
  document.body.prepend(bar);
  bar.querySelector('#pr').onclick = () => window.print();
  const count = () => { const n = document.querySelectorAll('.pagedjs_page').length; bar.querySelector('.status').textContent = n + (n === 1 ? ' A4 page' : ' A4 pages'); };
  count(); setTimeout(count, 1500); setTimeout(count, 5000);
  bar.querySelectorAll('[data-l]').forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.l === lipi));
    b.onclick = async () => {
      lipi = b.dataset.l; document.documentElement.dataset.lipi = lipi;
      try { localStorage.setItem('gpura-lipi', lipi); } catch (e) {}
      bar.querySelectorAll('[data-l]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      await document.fonts.ready; fit();
    };
  });
  }
})().catch(e => { document.body.insertAdjacentHTML('afterbegin', '<p style="padding:80px 20px">Could not build the PDF view: ' + e.message + '</p>'); });
</script>
</body>
</html>
